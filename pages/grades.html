  <body data-nav-base="../">
    <!-- Navigation will be loaded here automatically -->

    <div class="content-wrapper" id="contentWrapper">
      <div class="container">
        <div class="course-header">
          <h1>📝 Student Grades</h1>
          <p>Assignment and quiz results with downloadable teacher feedback.</p>
        </div>

        <div class="course-content">

          <section class="grades-board" aria-label="Grades Table">
            <div class="grades-toolbar">
              <h2>Gradebook</h2>
              <p>Current student: <strong id="studentName">Student 1</strong></p>
            </div>

            <div class="grades-table-wrap">
              <table class="grades-table">
                <thead>
                  <tr>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Submitted</th>
                    <th>Status</th>
                    <th>Grade</th>
                    <th>Feedback</th>
                  </tr>
                </thead>
                <tbody id="gradesTableBody">
                  <tr>
                    <td colspan="6">
                      <span class="feedback-pending">Loading gradebook...</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
